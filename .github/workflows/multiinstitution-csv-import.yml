name: Importacion CSV Multiinstitucion

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Identificador del trabajo Multi encolado por EQUITAS
        required: false
        type: string
  schedule:
    # Respaldo horario: las cargas nuevas se despachan inmediatamente desde
    # EQUITAS y se evita consumir minutos por polling frecuente sin cola.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: multiinstitution-csv-import-worker
  cancel-in-progress: false

jobs:
  process-queued-import:
    name: Procesar una importacion institucional encolada
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      MULTI_SUPABASE_URL: ${{ secrets.MULTI_SUPABASE_URL }}
      MULTI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MULTI_SUPABASE_SERVICE_ROLE_KEY }}
      MULTI_SUPABASE_PROJECT_REF: ${{ secrets.MULTI_SUPABASE_PROJECT_REF }}
      # La ausencia de esta variable bloquea APPLY. Solo el valor exacto true lo habilita.
      MULTI_IMPORT_APPLY_ENABLED: ${{ vars.MULTI_IMPORT_APPLY_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: back/.python-version
          cache: pip
          cache-dependency-path: |
            back/requirements.txt
            back/constraints.txt
      - name: Instalar dependencias del worker Multi
        working-directory: back
        run: python -m pip install --requirement requirements.txt --constraint constraints.txt
      - name: Procesar un trabajo institucional
        working-directory: back
        run: python -m ETL.multi_csv_worker --once
