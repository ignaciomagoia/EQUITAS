name: Verificar credenciales Supabase Produccion

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-production-supabase-credentials
  cancel-in-progress: false

jobs:
  verify-production-target:
    name: Verificar destino y acceso de solo lectura
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
    steps:
      - name: Validar proyecto y credenciales sin exponer secretos
        shell: python
        run: |
          import os
          import re
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode, urlparse
          from urllib.request import Request, urlopen

          raw_url = os.environ.get("SUPABASE_URL", "").strip()
          service_role_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "").strip()
          expected_project_ref = os.environ.get("SUPABASE_PRODUCTION_PROJECT_REF", "").strip().lower()

          if not raw_url or not service_role_key or not expected_project_ref:
              raise SystemExit(
                  "Faltan secretos de Produccion o la variable SUPABASE_PRODUCTION_PROJECT_REF."
              )

          if not re.fullmatch(r"[a-z0-9]+", expected_project_ref):
              raise SystemExit("El project ref esperado tiene un formato invalido.")

          parsed_url = urlparse(raw_url)
          expected_host = f"{expected_project_ref}.supabase.co"

          if (
              parsed_url.scheme != "https"
              or parsed_url.hostname is None
              or parsed_url.hostname.lower() != expected_host
              or parsed_url.path not in ("", "/")
              or parsed_url.params
              or parsed_url.query
              or parsed_url.fragment
          ):
              raise SystemExit("SUPABASE_URL no pertenece al proyecto de Produccion esperado.")

          endpoint = (
              f"https://{expected_host}/rest/v1/data_import_authorization?"
              + urlencode({"select": "tenant", "limit": "1"})
          )
          request = Request(
              endpoint,
              headers={
                  "apikey": service_role_key,
                  "Accept": "application/json",
              },
              method="GET",
          )

          try:
              with urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise SystemExit("La comprobacion de solo lectura no obtuvo una respuesta valida.")
                  response.read(1)
          except HTTPError as error:
              raise SystemExit(
                  f"La comprobacion de solo lectura fue rechazada (HTTP {error.code})."
              ) from None
          except URLError:
              raise SystemExit("No se pudo conectar al proyecto Supabase esperado.") from None

          print("Destino de Produccion y acceso de solo lectura verificados.")
