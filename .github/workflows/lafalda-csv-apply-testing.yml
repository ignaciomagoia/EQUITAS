name: Retirado - apply CSV La Falda en Testing

# EQUITAS-TP-TESTING se reserva para la futura plataforma multiinstitucion.
# Se conserva el archivo como registro historico, sin secretos ni conexiones.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Integracion La Falda retirada
    runs-on: ubuntu-24.04
    steps:
      - name: Informar retiro seguro
        run: |
          echo "La prueba aislada de apply de La Falda fue retirada."
          echo "EQUITAS-TP-TESTING se prepara para Multiinstitucion."
          echo "No se usaron secretos ni se realizo ninguna conexion remota."
