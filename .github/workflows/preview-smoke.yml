name: Retirado - preview smoke Supabase Testing

# El preview historico dependia de fixtures y secretos del antiguo
# EQUITAS-TP-TESTING. No se ejecuta automaticamente ni usa secretos.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Smoke historico retirado
    runs-on: ubuntu-24.04
    steps:
      - name: Informar retiro seguro
        run: |
          echo "El smoke historico de Preview fue retirado antes de convertir EQUITAS-TP-TESTING."
          echo "No se usaron secretos de Supabase ni se realizo ninguna conexion remota."
