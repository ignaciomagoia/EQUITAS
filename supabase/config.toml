# Configuracion LOCAL reproducible; no enlaza ni modifica ningun proyecto cloud.
# Se separa del antiguo nombre EQUITAS-TP-TESTING antes de su conversion a
# Multiinstitucion. No ejecutar `supabase link` hasta verificar manualmente el
# destino remoto correcto.
project_id = "equitas-multiinstitution-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.local_apply.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = false
